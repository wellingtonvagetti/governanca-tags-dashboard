name: deploy-poc

# Publica o codigo no web app da POC.
# - push na main (versao validada) ou manual (workflow_dispatch).
# - So codigo: o banco (/home/data) nao e tocado.
# - Login Azure por OIDC (sem senha), environment "poc".
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "frontend/**"
      - "modulos/**"
      - "database/**"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/deploy-poc.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-poc
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q api tools database tests
      - run: python -m unittest discover -s tests -v

  deploy:
    needs: testes
    runs-on: ubuntu-latest
    environment: poc
    steps:
      - uses: actions/checkout@v4

      - name: Empacotar (HEAD, sem historico)
        run: git archive --format=zip -o "$RUNNER_TEMP/dash.zip" HEAD

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolver hostname real do App Service
        id: webapp
        run: |
          hostname=$(az webapp show \
            -g "${{ vars.TF_RESOURCE_GROUP }}" -n "${{ vars.TF_APP_NAME }}" \
            --query defaultHostName -o tsv)
          test -n "$hostname"
          echo "hostname=$hostname" >> "$GITHUB_OUTPUT"
          echo "App Service: $hostname"

      - name: Configurar runtime Python e startup do FastAPI
        run: |
          az webapp config appsettings set \
            -g "${{ vars.TF_RESOURCE_GROUP }}" -n "${{ vars.TF_APP_NAME }}" \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true
          az webapp config set \
            -g "${{ vars.TF_RESOURCE_GROUP }}" -n "${{ vars.TF_APP_NAME }}" \
            --startup-file 'python -m uvicorn api.main:app --host 0.0.0.0 --port ${PORT:-8000}'

      - name: Deploy (zip)
        run: |
          az webapp deploy \
            -g "${{ vars.TF_RESOURCE_GROUP }}" -n "${{ vars.TF_APP_NAME }}" \
            --src-path "$RUNNER_TEMP/dash.zip" --type zip --timeout 1200000 \
            --clean true --track-status false

      - name: Verificar aplicacao FastAPI
        run: |
          for i in $(seq 1 20); do
            sleep 30
            body=$(curl -fsSL --max-time 60 "https://${{ steps.webapp.outputs.hostname }}/" || true)
            if printf '%s' "$body" | grep -qi 'FinOps'; then
              echo "FastAPI respondeu corretamente na tentativa $i"
              exit 0
            fi
            echo "tentativa $i: aplicacao ainda indisponivel"
          done
          echo "O App Service nao iniciou a aplicacao FastAPI"; exit 1
