name: ci

# Verificacoes rapidas em todo PR e em push para dev/main.
on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sintaxe (Python)
        run: python -m compileall -q api tools database tests
      - name: Regressao da camada de dados (SQLite)
        run: python -m unittest discover -s tests -v

  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # CLI do gitleaks: a gitleaks-action exige licenca em repos de organizacao
      - name: Instalar gitleaks
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
      - name: Procurar segredos (historico inteiro)
        run: ./gitleaks git . --redact --no-banner --log-opts="--all" --exit-code 1
