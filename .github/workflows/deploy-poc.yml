name: deploy-poc

# Publica o codigo no web app da POC.
# - push na main (versao validada) ou manual (workflow_dispatch).
# - So codigo: o banco (/home/data) nao e tocado.
# - Login Azure por OIDC (sem senha), environment "poc".
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "frontend/**"
      - "modulos/**"
      - "database/**"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/deploy-poc.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-poc
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q api tools database tests
      - run: python -m unittest discover -s tests -v

  deploy:
    needs: testes
    runs-on: ubuntu-latest
    environment: poc
    steps:
      - uses: actions/checkout@v4

      - name: Empacotar (HEAD, sem historico)
        run: git archive --format=zip -o "$RUNNER_TEMP/dash.zip" HEAD

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy (zip)
        run: |
          az webapp deploy \
            -g "${{ vars.TF_RESOURCE_GROUP }}" -n "${{ vars.TF_APP_NAME }}" \
            --src-path "$RUNNER_TEMP/dash.zip" --type zip --timeout 1200000

      - name: Verificar que o app responde
        run: |
          sleep 30
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "https://${{ vars.TF_APP_NAME }}.azurewebsites.net/")
          echo "HTTP $code"
          # com login (Easy Auth) o app responde 200, 302 ou 401: qualquer um indica que subiu
          case "$code" in 200|301|302|401) exit 0;; *) echo "app nao respondeu como esperado"; exit 1;; esac
